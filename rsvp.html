<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP</title>
<style>
  body { margin: 0; background: #cdd5db; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwBBasFIzfjoFAWzCA7hvKZWBIUFQxJMv6vCryUwHLQ9P84nlJC9GK6ei0Tawr7MUrb/exec';
const params = new URLSearchParams(location.search);
const token = params.get('token');
const response = params.get('response');
if (token && response) {
  window.location.href = WEBAPP_URL + '?token=' + encodeURIComponent(token) + '&response=' + response;
}
</script>
</body>
</html>
